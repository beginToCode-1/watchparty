# Template: docker-compose renders ${TURN_SECRET} and ${TURN_EXTERNAL_IP} with sed before starting turnserver.

# Listeners
listening-port=3478
tls-listening-port=5349
# relay range: must match the docker-compose UDP mapping
min-port=49160
max-port=49200

# Auth: TURN REST API (HMAC-SHA1 time-limited credentials, username = "<expiry>:<userId>")
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=watchparty
fingerprint

# NAT: public IP of the host; "public/private" form when coturn runs behind Docker NAT
external-ip=${TURN_EXTERNAL_IP}

# TLS (turns:)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"

# Abuse limits
total-quota=1200
user-quota=24
max-bps=8000000
stale-nonce=600

# SSRF hardening: the relay must never reach private networks
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Ops
no-cli
no-software-attribute
log-file=stdout
simple-log
